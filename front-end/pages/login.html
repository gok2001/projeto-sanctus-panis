<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanctus Panis</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <div id="header"></div>

    <main class="main">

        <section class="container login">
            <h1 class="title-login">Login</h1>

            <form class="login-form">
                <fieldset class="login-field">
                    <label for="email">Email</label>
                    <input type="email" name="email-login" id="email-login" title="Digite seu email" maxlength="50" placeholder="email@email.com" required>

                    <label for="senha" class="label-login">Senha</label>
                    <input type="password" name="senha-login" id="senha-login" title="Digite sua senha" minlength="8" required>
                </fieldset>
                
                <button type="submit" class="btn">Entrar</button>
            </form>
            
            <p>Não possui conta? <a href="cadastro.html" class="cadastro-link">Cadastre-se</a></p>
        </section>

    </main>

    <div id="footer"></div>

    <script src="../scripts/script.js"></script>
    <script src="../scripts/script-login.js"></script>
</body>
</html>
