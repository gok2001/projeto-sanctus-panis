<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanctus Panis</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <div id="header"></div>

    <main class="main-login">
        <section class="login">
            <h1 class="title-login">Login</h1>
            <form action="" method="POST" class="login-form">
                <label for="email" class="label-login">Email</label>
                <input type="email" name="" id="" class="input-login" title="Digite seu email" maxlength="50" placeholder="email@email.com" required>

                <label for="senha" class="label-login">Senha</label>
                <input type="password" name="" id="" class="input-login" title="Digite sua senha" minlength="8" required>
                
                <button type="submit" class="btn login-btn">Entrar</button>
            </form>
            <p>Não possui conta? <a href="cadastro.html" class="cadastro-link">Cadastre-se</a></p>
        </section>
    </main>

    <div id="footer"></div>

    <script src="../scripts/script.js"></script>
</body>
</html>
