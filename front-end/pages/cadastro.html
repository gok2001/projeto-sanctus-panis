<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanctus Panis</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <div id="header"></div>

    <main class="main">

        <section class="container cadastro">
            <h1 class="cadastro-title">Cadastro</h1>

            <form action="" method="POST" class="form-cadastro">
                <label for="email" class="label-cadastro">Email</label>
                <input type="email" name="" id="" class="input-cadastro" title="Digite seu email" placeholder="email@email.com" maxlength="50" required>

                <label for="cpf" class="label-cadastro">CPF</label>
                <input type="text" name="" id="" class="input-cadastro" pattern="\d{3}\.\d{3}\.\d{3}\-\d{2}" title="Digite seu CPF" maxlength="14" placeholder="000.000.000-00" required>

                <label for="senha" class="label-cadastro">Senha</label>
                <input type="password" name="" id="" class="input-cadastro" title="Digite sua senha" minlength="8" required>

                <label for="senha" class="label-cadastro">Confirmar Senha</label>
                <input type="password" name="" id="" class="input-cadastro" title="Digite sua senha" minlength="8" required>
                
                <button type="submit" class="btn cadastro-btn">Cadastrar</button>
            </form>
            
            <p>Já possui conta? <a href="login.html" class="login-link">Entrar</a></p>
        </section>

    </main>

    <div id="footer"></div>

    <script src="../scripts/script.js"></script>
</body>
</html>
