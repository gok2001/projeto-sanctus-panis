<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <div id="header"></div>
    
    <main class="main">

        <section class="container cardapio">
            <h1>Cardápio</h1>

            <div class="lista-cardapio"></div>
        </section>

        <button type="button" class="btn btn-admin hidden">Adicionar item</button>

        <div class="container modal-lanche hidden">
            <h3>Adicionar Lanche</h3>

            <form class="form-lanche">

                <fieldset class="lanche-field">
                    <input type="text" id="nome-lanche" placeholder="Nome do lanche">
                    <input type="number" id="preco-lanche" step="0.01" min="0" placeholder="Preço">
                    <div class="ingredientes-container"></div>
                </fieldset>

                <div class="btns">
                    <button type="button" class="btn btn-add-ingrediente">+ Ingrediente</button>
                    <button type="submit" class="btn">Salvar Lanche</button>
                </div>

            </form>
        </div>

    </main>
    
    <div id="footer"></div>

    <script type="module" src="../scripts/layout.js"></script>
    <script type="module" src="../scripts/cardapio.js"></script>
</body>
</html>
