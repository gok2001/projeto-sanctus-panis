<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <div id="header"></div>
    
    <main class="main">

        <section class="container cardapio">
            <h1>Cardápio</h1>

            <div class="lista-cardapio">

                <article class="item-cardapio">
                    <div class="item-info">
                        <h2>X-Burger</h2>
                        <p class="descricao">Pão, hamburguer, queijo, alface e tomate</p>
                        <p class="preco">R$ 19,90</p>
                    </div>
                    <div class="acoes-item">
                        <div class="quantidade">
                            <button class="btn menos">-</button>
                            <span class="qtd">0</span>
                            <button class="btn mais">+</button>
                        </div>
                        <button class="btn">Adicionar</button>
                    </div>
                </article>

            </div>

        </section>

        <button type="button" class="btn btn-admin hidden">Adicionar item</button>

    </main>
    
    <div id="footer"></div>

    <script src="../scripts/layout.js"></script>
    <script type="module" src="../scripts/cardapio.js"></script>
</body>
</html>
