<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <div id="header"></div>
    
    <main class="main-cardapio">

        <section class="cardapio">
            <h2>Cardápio</h2>

            <div class="item">
                <div class="img">
                    <img src="../assets/x-bacon.png" alt="Imagem do lanche">
                </div>

                <div class="descricao">
                    <h3>X-Burger</h3>
                    <p class="texto">Hambúrguer com queijo, alface e tomatehihhhhhihhihihihihihihihihihihihihihihihihihihihihihihihihihih</p>
                    <span class="toggle">Saiba mais...</span>
                </div>

                <div class="preco">
                    R$ 19,90
                </div>

                <div class="acao">
                    <div class="quantidade">
                        <button class="menos">-</button>
                        <span class="qtd">0</span>
                        <button class="mais">+</button>
                    </div>
                    <button class="add">Adicionar</button>
                </div>
            </div>
        </section>

    </main>
    
    <div id="footer"></div>

    <script src="../scripts/script.js"></script>
</body>
</html>
