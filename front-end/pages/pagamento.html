<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanctus Panis</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <div id="header"></div>
    
    <main class="main">

        <section class="container finalizar-pedido" aria-labelledby="titulo-finalizar">
            
            <h1 id="titulo-finalizar">Finalizar pedido</h1>

             <div class="resumo-pedido">
                <h2>Resumo do Pedido</h2>
                <div id="itens-resumo"></div>
                <p id="total-resumo"><strong>Total: R$0,00</strong></p>
            </div>
        
            <fieldset class="entrega-retirada">
                <legend class="bold">Selecione uma opção</legend>

                <div class="opcoes">
                    <input type="radio" name="opcao" id="entrega" value="entrega" required>
                    <label for="entrega">Entrega</label>
                    <input type="radio" name="opcao" id="retirada" value="retirada">
                    <label for="retirada">Retirada</label>
                </div>
            </fieldset>

            <form class="form-finalizar-pedido">

                <div id="pagamento" class="pagamento hidden">

                    <fieldset class="endereco">
                        <legend class="bold">Endereço</legend>

                        <label for="cep">CEP</label>
                        <input type="text" name="cep" id="cep" placeholder="00000-000" inputmode="numeric" autocomplete="postal-code" required>

                        <label for="rua">Rua</label>
                        <input type="text" name="rua" id="rua" placeholder="Rua exemplo" autocomplete="address-line1" required>

                        <label for="numero">Número</label>
                        <input type="text" name="numero" id="numero" inputmode="numeric" placeholder="000" required>

                        <label for="bairro">Bairro</label>
                        <input type="text" name="bairro" id="bairro" placeholder="Bairro exemplo" required>
                    </fieldset>

                    <div class="metodo-pagamento">
                        <label class="bold" for="seleciona-pagamento">Método de Pagamento</label>

                        <select name="seleciona-pagamento" id="seleciona-pagamento">
                            <option value="">Selecione uma opção</option>
                            <option value="dinheiro">Dinheiro</option>
                            <option value="cartao">Cartão</option>
                            <option value="pix">Pix</option>
                        </select>

                        <div id="troco-container" class="hidden">
                            <label for="troco">Troco para quanto?</label>
                            <input type="number" id="troco" placeholder="Ex: 50.00" min="0" step="0.01">
                        </div>
                    </div>

                </div>

                <button type="submit" class="btn">Finalizar Pedido</button>

            </form>

        </section>

    </main>
    
    <div id="footer"></div>

    <script src="../scripts/layout.js"></script>
    <script type="module" src="../scripts/pagamento.js"></script>
</body>
</html>
