<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanctus Panis</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <div id="header"></div>
    
    <main class="main">

        <section class="container finalizar-pedido-container">
            <h2>Finalizar pedido</h2>
        
            <form class="form-finalizar-pedido">
                <div class="entrega-retirada">
                    <input type="radio" name="opcao" id="entrega" value="entrega">
                    <label for="entrega">Entrega</label>

                    <input type="radio" name="opcao" id="retirada" value="retirada">
                    <label for="retirada">Retirada</label>
                </div>

                <div id="pagamento" class="pagamento" style="display: none;">
                    <label>Método de Pagamento</label>
                    <select>
                        <option>Dinheiro</option>
                        <option>Cartão</option>
                        <option>Pix</option>
                    </select>
                </div>

                <div class="resumo-pedido">
                    <h3>Resumo do Pedido</h3>
                    <p>Hot Dog Especial</p>
                    <p>Refrigerante</p>
                    <p><strong>Total: R$ 29,90</strong></p>
                </div>

                <button class="btn">Finalizar Pedido</button>
            </form>
        </section>

    </main>
    
    <div id="footer"></div>

    <script src="../scripts/script.js"></script>
</body>
</html>
