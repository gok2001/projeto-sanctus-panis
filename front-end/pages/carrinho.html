<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <div id="header"></div>
    
    <main class="main">

        <section class="container carrinho">
            <h1>Carrinho</h1>

            <div class="carrinho-pedido">
                <h2 class="nome-lanche">X-Burguer</h2>
                <p class="observacoes">Observações:</p>
                <p class="preco preco-carrinho">R$ 29,90</p>

                <button class="btn">Excluir</button>
            </div>

            <div class="total">
                <p>Total: R$ 29,90</p>
            </div>
            
            <div class="btns">
                <button class="btn">Adicionar mais itens</button>
                <button class="btn">Finalizar Pedido</button>
            </div>
        </section>
        
    </main>  

    <div id="footer"></div>

    <script src="../scripts/layout.js"></script>
</body>
</html>
